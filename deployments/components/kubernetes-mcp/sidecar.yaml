# Opt-in infrastructure only. Enable JWT/PAT and pod-exec separately after provisioning keys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: olixops-k8s-ctl
  namespace: olixops
spec:
  template:
    spec:
      containers:
        - name: kubernetes-mcp
          image: quay.io/containers/kubernetes_mcp_server:v0.1.2
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/kubernetes-mcp/config.toml"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: kubernetes-mcp-config
              mountPath: /etc/kubernetes-mcp
              readOnly: true
      volumes:
        - name: kubernetes-mcp-config
          configMap:
            name: olixops-kubernetes-mcp

# NOT included in kustomization: choose each permitted business namespace explicitly.
# Change demo before applying. Never bind this Role cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-ctl-pod-exec
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"] # WebSocket GET; SPDY POST fallback in upstream v0.1.2.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-ctl-pod-exec
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-ctl-pod-exec
subjects:
  - kind: ServiceAccount
    name: olixops-k8s-ctl
    namespace: olixops

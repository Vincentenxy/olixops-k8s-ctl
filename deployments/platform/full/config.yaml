# Full controller, called through authenticated HTTP; no external MCP required.
app:
  name: k8s-ctl
  version: 0.2.0
server:
  host: 0.0.0.0
  port: 8901
  mode: release
  public-url: "" # Relative transfer paths; the upper platform owns its public URL.
http:
  enabled: true
mcp:
  enabled: false
  write-enabled: true
  diagnostics-only: false
cluster:
  id: poc
auth:
  enabled: true
  jwt:
    enabled: true
    # Set AUTH_JWT_PUBLIC_KEY to the platform PEM or Base64 DER public key.
    public-key: ""
    issuer: ""
    audience: ""
    key-id: ""
  pat:
    enabled: false # Enable with the same Redis database used by Setting.
kubernetes:
  in-cluster: true
  write-enabled: true
  command-timeout-seconds: 120
  kubectl: kubectl
  helm: helm
  kubeconfig:
    source: file
pod-exec:
  enabled: true
  mode: sidecar
  endpoint: http://127.0.0.1:8082/mcp
  grants: []
shell:
  enabled: true
  terminal:
    idle-seconds: 300
    lifetime-seconds: 1800
    max-sessions: 128
    max-per-user: 8
  interceptor:
    enabled: true
    provider: allow-all
catalog:
  enabled: true
  cluster: poc
  database-path: /data/olixops.db
  default-owner: platform
  default-storage-class: local-path
  gateway-id: higress
  gateway-namespace: higress-system
  gateway-service: higress-gateway
  gateway-name: higress-tcp-gateway
  port-start: 30000
  port-end: 30200

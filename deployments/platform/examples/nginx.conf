# Optional fragment inside an existing Nginx http/server configuration.
# Use a trusted internal network or terminate TLS in the enclosing server.
# The upstream name must resolve and be reachable from Nginx.
# Set server.public-url to the actual https://<host>/k8sctl when using this prefix.
location /k8sctl/ {
    proxy_pass http://olixops-k8s-ctl-platform.olixops-platform.svc.cluster.local:8091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_next_upstream off;
}

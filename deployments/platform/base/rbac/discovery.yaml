apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: olixops-k8s-ctl-platform-discovery
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - get
  - list
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  verbs:
  - get
  - list
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - tcproutes
  verbs:
  - get
  - list
- nonResourceURLs:
  - /version
  - /api
  - /api/*
  - /apis
  - /apis/*
  - /openapi
  - /openapi/*
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: olixops-k8s-ctl-platform-discovery
subjects:
- kind: ServiceAccount
  name: olixops-k8s-ctl-platform
  namespace: olixops-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: olixops-k8s-ctl-platform-discovery

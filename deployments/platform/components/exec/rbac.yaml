# Included only by the exec component. Bind each permitted business namespace explicitly.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: olixops-k8s-ctl-platform-exec
  namespace: developer-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"] # WebSocket GET; SPDY POST fallback in upstream v0.1.2.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: olixops-k8s-ctl-platform-exec
  namespace: developer-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: olixops-k8s-ctl-platform-exec
subjects:
  - kind: ServiceAccount
    name: olixops-k8s-ctl-platform
    namespace: olixops-platform

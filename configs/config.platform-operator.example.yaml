# Local/out-of-cluster operator: publish loads and decrypts credentials, then registers clusters
# Copy as config.yaml in a private runtime directory and set the mounted file paths
# Start: go run ./cmd/operator --config-dir <directory> --max-clusters 16
app:
  name: k8s-ctl
  version: 0.2.0
server:
  host: 127.0.0.1
  port: 19091
  mode: release
http:
  enabled: true
mcp:
  enabled: false # publish exposes the user-facing MCP server
  write-enabled: false
  diagnostics-only: false
cluster:
  id: platform-operator
control:
  api-key-file: /run/k8s-ctl/control-key
auth:
  enabled: true
  company:
    enabled: true
    issuer: publish-devops-api
    audience: k8s-ctl:platform-operator # replaced with k8s-ctl:<clusterId> for each runtime
    key-id: platform-v1
    public-key-file: /run/k8s-ctl/platform-public.pem
  pat:
    enabled: false
kubernetes:
  in-cluster: false
  write-enabled: true
  command-timeout-seconds: 120
  kubectl: kubectl
  helm: helm
  kubeconfig:
    source: file # no startup credential read; all runtimes use the memory Provider
pod-exec:
  authorization-enabled: false # Temporary integration testing; restore true with the permission model
  enabled: true
  mode: managed
  binary: /usr/local/bin/kubernetes-mcp-server # existing upstream v0.1.2 binary
  grants: [] # ignored while authorization-enabled=false; UID and session ownership remain
shell:
  enabled: true
  interceptor:
    enabled: false # Temporary integration testing
    provider: allow-all
  terminal:
    max-sessions: 128
    max-per-user: 16
    idle-seconds: 900
    lifetime-seconds: 3600
catalog:
  enabled: false
  cluster: platform-operator

# publish-devops-api integration: all supported controller capabilities enabled.
# Copy as config.yaml in a dedicated config directory; mount the platform public key.
# This is an internal authenticated endpoint. User authorization belongs to the platform.
# Replace example cluster/namespace/gateway values before deployment; no credentials here.
app:
  name: k8s-ctl
  version: 0.2.0
server:
  host: 0.0.0.0
  port: 8080
  mode: release
  public-url: https://operator.internal.example/k8sctl
http:
  enabled: true
mcp:
  enabled: true # Optional for platform use; internal HTTP alone is sufficient.
  write-enabled: true
  diagnostics-only: false
cluster:
  id: poc
auth:
  enabled: true
  company:
    enabled: true
    issuer: publish-devops-api
    audience: k8s-ctl:poc
    key-id: platform-v1
    public-key-file: /var/run/k8s-ctl-auth/platform-public.pem
  pat:
    enabled: false
kubernetes:
  in-cluster: true
  write-enabled: true
  command-timeout-seconds: 120
  kubectl: kubectl
  helm: helm
  kubeconfig:
    source: file # in-cluster=true selects the ServiceAccount Provider at startup.
# Existing private Kubernetes MCP execution sidecar, not the external main MCP.
pod-exec:
  enabled: true
  mode: sidecar
  endpoint: http://127.0.0.1:8082/mcp
  # Do not duplicate per-user grants here; the platform authorizes each operation.
  # Namespace scope, Pod eligibility, user-bound handles and Kubernetes RBAC still apply.
  grants: []
shell:
  enabled: true
  interceptor:
    enabled: true
    provider: allow-all
catalog:
  enabled: true
  cluster: poc
  database-path: /data/olixops.db
  default-owner: platform
  default-storage-class: local-path
  gateway-id: higress
  gateway-namespace: higress-system
  gateway-service: higress-gateway
  gateway-name: higress-tcp-gateway
  port-start: 30000
  port-end: 30200

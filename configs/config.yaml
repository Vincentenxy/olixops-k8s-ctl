server:
  host: 127.0.0.1
  port: 8091
  mode: debug # debug / release / test

app:
  name: olixops-k8s-ctl
  version: 0.2.0

kubernetes:
  in-cluster: false
  kubeconfig:
    source: file
    path: ""
    reference: ""
    context: ""
  write-enabled: true
  allowed-namespaces: []
  command-timeout-seconds: 120
  kubectl: kubectl
  helm: helm

control:
  api-key: ""

# MCP write tools are opt-in. The future authorization hook currently allows all.
mcp:
  enabled: true
  write-enabled: true
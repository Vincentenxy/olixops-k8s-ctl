# k8s-ctl 唯一运行配置
# app.mode 可选 operator 或 standalone，启动入口和 Docker 镜像保持不变
# Viper 环境变量优先于 YAML，点和短横线转换为下划线，例如 AUTH_JWT_PUBLIC_KEY
# 凭据通过环境变量、挂载文件或 Kubernetes Secret 注入，不写入此文件

app:
  mode: operator
  name: k8s-ctl
  version: 0.2.0

operator:
  max-clusters: 16

server:
  host: 127.0.0.1
  port: 8901
  public-url: ""
  mode: debug

http:
  enabled: true

cluster:
  id: platform-operator

auth:
  enabled: true
  jwt:
    enabled: true
    # 公司统一 JWT 的 RSA 公钥、issuer、audience 和 key-id
    public-key: 
    issuer: https://eiam.qiuer.net/auth/oidc/62F295C3C382499EA2124E6C8B080B8E
    audience: ZmEyMjBjNWFhNmI2NDhlOWE4NzYwNjkyNjQ5ZWQ4NTg
  pat:
    enabled: true
    issuer: efficient-platform
    audience: platform-api
    key-id: platform-pat-v1
    public-key: 

control:
  api-key: ""
  api-key-file: ""

kubernetes:
  in-cluster: false
  write-enabled: true
  command-timeout-seconds: 120
  kubectl: kubectl
  helm: helm
  kubeconfig:
    source: file
    path: ""
    reference: ""
    context: ""



# 当前 operator 只提供资源和日志能力，因此不配置 pod-exec/shell。
# 需要 Shell、终端或文件传输时，再按 configs/config.example.yaml 的可选块显式开启。
mcp:
  enabled: false
  write-enabled: false
  diagnostics-only: false


pod-exec:
  authorization-enabled: false
  enabled: true
  mode: managed
  # 必须是本机/镜像内存在且版本为 v0.1.2 的 kubernetes-mcp-server
  binary: kubernetes-mcp-server

shell:
  enabled: true
  interceptor:
    enabled: true
    provider: allow-all
  terminal:
    idle-seconds: 300
    lifetime-seconds: 1800
    max-sessions: 16
    max-per-user: 4

catalog:
  enabled: false
  database-path: /data/olixops.db
  cluster: platform-operator
  default-owner: platform
  default-storage-class: local-path
  sandbox-runtime-class: ""
  gateway-id: higress
  gateway-namespace: higress-system
  gateway-service: higress-gateway
  gateway-name: higress-tcp-gateway
  port-start: 30000
  port-end: 30200
